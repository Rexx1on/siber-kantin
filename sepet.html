<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101713">
  <title>Tepsim ve Ödeme | SiberKantin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link href="style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-black border-bottom border-success"><div class="container"><a class="navbar-brand fw-bold text-success fs-3" href="index.html"><i class="fa-solid fa-utensils"></i> SİBER<span class="text-white">KANTİN</span></a><a class="nav-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Menüye dön</a></div></nav>
  <main class="container my-5"><div class="row g-4">
    <section class="col-lg-8"><h1 class="h3 text-success mb-3">Tepsimdeki yemekler</h1><div class="table-responsive"><table class="table table-dark table-striped table-hover table-bordered align-middle text-center"><thead class="table-success text-dark"><tr><th>Görsel</th><th>Yemek adı</th><th>Kalori</th><th>Hazırlanma süresi</th><th>Fiyat</th><th>Sil</th></tr></thead><tbody id="tepsiTabloGovdesi"></tbody><tfoot><tr><td colspan="2" class="text-end fw-bold">TOPLAM:</td><td id="toplamKalori" class="fw-bold text-warning">0 kcal</td><td id="toplamSure" class="fw-bold">0 dk</td><td colspan="2" id="toplamFiyat" class="fw-bold text-success fs-4">0 TL</td></tr></tfoot></table></div><a class="btn btn-outline-success" href="index.html">Menüden yemek ekle</a></section>
    <aside class="col-lg-4"><div class="card bg-black text-light border-success p-3"><h2 class="h4 text-success mb-3">Sipariş onayı</h2><div class="input-group mb-3"><input type="text" id="kuponInput" class="form-control bg-dark text-light" placeholder="Öğrenci indirim kodu" aria-label="İndirim kodu"><button onclick="indirimYap()" class="btn btn-outline-success">Uygula</button></div><div id="indirimMesaj" aria-live="polite"></div>
      <form onsubmit="siparisVer(event)"><div class="mb-3"><label for="ogrenciAd" class="form-label">Öğrenci ad soyad:</label><input type="text" id="ogrenciAd" class="form-control bg-dark text-light" required maxlength="80" autocomplete="name"></div><div class="mb-3"><label for="kartSifre" class="form-label">4 haneli Kampüs Kart şifresi:</label><input type="password" id="kartSifre" class="form-control bg-dark text-light" placeholder="1234" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" required title="Şifre 4 rakamdan oluşmalıdır."></div><button type="submit" class="btn btn-success w-100 fw-bold">SİPARİŞİ TAMAMLA</button></form>
    </div></aside>
  </div></main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="app.js"></script>
</body>
</html>
